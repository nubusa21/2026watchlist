<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dito's Watchlist 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2rem; color: #00e054; }
        header p { color: #888; font-size: 0.95rem; margin-top: 5px; }
        .container { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .skeleton-card {
            width: 100%; height: 220px; border-radius: 16px;
            background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .card {
            position: relative; width: 100%; height: 220px; border-radius: 16px;
            overflow: hidden; background-color: #1a1a1a; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer; text-decoration: none; color: inherit; display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: scale(1.02); box-shadow: 0 12px 25px rgba(0,225,84,0.2); }
        .card-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; filter: brightness(0.6);
            transition: filter 0.3s;
        }
        .card:hover .card-bg { filter: brightness(0.75); }
        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
        }
        .card-ranking {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            font-size: 2rem; font-weight: 700; color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.4); padding: 10px 15px; border-radius: 10px; backdrop-filter: blur(5px);
            z-index: 2;
        }
        .card-content {
            position: absolute; left: 110px; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 8px; z-index: 2;
        }
        .card-title {
            font-size: 1.4rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .card-rating { display: flex; gap: 4px; color: #00e054; font-size: 1.1rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .card-rating .far { color: rgba(255, 255, 255, 0.3); }
        .error { text-align: center; padding: 40px; font-size: 1rem; color: #ff5252; background: #1a1a1a; border-radius: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>Dito's Letterboxd Watchlist</h1>
        <p>Otomatisasi Film & Serial 2026</p>
    </header>

    <div class="container" id="card-container">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>

    <script>
        async function loadWatchlist() {
            const container = document.getElementById("card-container");
            const scriptUrl = "https://script.google.com/macros/s/AKfycbxG0m2yvFlttTWAl4E2fit26E1BCVENQXuc9zAXRKkjyge-3yQ9Z006X7gTciTZLGc5gg/exec"; 

            try {
                let response = await fetch(scriptUrl);
                if (!response.ok) throw new Error("HTTP error! status: " + response.status);
                
                let data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="error">Belum ada data untuk ditampilkan di Spreadsheet.</div>`;
                    return;
                }

                container.innerHTML = "";

                for (let i = 0; i < data.length; i++) {
                    let item = data[i];
                    let starHtml = generateStars(item.rating);
                    
                    let formattedSlug = item.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    let letterboxdOfficialUrl = `https://letterboxd.com/${item.type === 'serial' ? 'show' : 'film'}/${formattedSlug}/`;

                    let bgHtml = item.backdrop ? `
                        <div class="card-bg" style="background-image: url('${item.backdrop}');" loading="lazy"></div>
                        <div class="card-overlay"></div>
                    ` : '';

                    let cardHtml = `
                        <a href="${letterboxdOfficialUrl}" target="_blank" class="card">
                            ${bgHtml}
                            <div class="card-ranking">#${i + 1}</div>
                            <div class="card-content">
                                <div class="card-title">${item.name}</div>
                                <div class="card-rating">${starHtml}</div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += cardHtml;
                }
            } catch (err) {
                container.innerHTML = `<div class="error">Gagal memuat data: ${err.message}.<br>Pastikan Web App sudah dideploy ulang dengan akses 'Anyone'.</div>`;
            }
        }

        function generateStars(rating) {
            let html = "";
            let fullStars = Math.floor(rating);
            let hasHalfStar = (rating - fullStars) >= 0.5;

            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    html += `<i class="fas fa-star"></i>`;
                } else if (i === fullStars && hasHalfStar) {
                    html += `<i class="fas fa-star-half-alt"></i>`;
                } else {
                    html += `<i class="far fa-star"></i>`;
                }
            }
            return html;
        }

        loadWatchlist();
    </script>
</body>
</html>
